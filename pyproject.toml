[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clientphalanx"
version = "0.1.0"
description = "Self-Hosted Freelancer Client Portal & Invoicing Engine"
readme = "README.md"
authors = [{ name = "Scempyyy" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["freelancer", "invoicing", "client-portal", "milestones", "billing", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.scripts]
clientphalanx = "clientphalanx.cli:main"

[tool.setuptools.packages.find]
include = ["clientphalanx*"]
